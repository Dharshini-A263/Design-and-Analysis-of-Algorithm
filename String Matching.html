<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>String Matching Visualizer</title>

<style>
    * {
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        margin: 0;
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        color: #333;
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
    }

    textarea, input {
        width: 100%;
        padding: 10px;
        margin: 10px 0 20px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    textarea {
        height: 120px;
        resize: vertical;
    }

    .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #4facfe;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: #007bff;
    }

    .results {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .card {
        padding: 15px;
        border-radius: 10px;
        background: #f8f9fa;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card h3 {
        margin-top: 0;
    }

    .highlight {
        color: #007bff;
        font-weight: bold;
    }

</style>
</head>

<body>

<div class="container">
    <h1>🔍 String Matching Visualizer</h1>

    <label>Text (can be large ~10,000 chars):</label>
    <textarea id="text"></textarea>

    <label>Pattern:</label>
    <input type="text" id="pattern" placeholder="Try length 5, 10, 20, 50">

    <div class="buttons">
        <button onclick="run()">Run Algorithms</button>
        <button onclick="generateText()">Generate Random Text</button>
    </div>

    <div class="results" id="results"></div>
</div>

<script>

// Generate random text
function generateText() {
    let chars = "abcdefghijklmnopqrstuvwxyz";
    let text = "";
    for (let i = 0; i < 10000; i++) {
        text += chars[Math.floor(Math.random() * chars.length)];
    }
    document.getElementById("text").value = text;
}

// NAIVE
function naive(text, pattern) {
    let n = text.length, m = pattern.length;
    let comparisons = 0;

    for (let i = 0; i <= n - m; i++) {
        let j;
        for (j = 0; j < m; j++) {
            comparisons++;
            if (text[i + j] !== pattern[j]) break;
        }
    }
    return comparisons;
}

// KMP
function lpsArray(p) {
    let lps = Array(p.length).fill(0);
    let len = 0, i = 1;

    while (i < p.length) {
        if (p[i] === p[len]) {
            lps[i++] = ++len;
        } else {
            if (len !== 0) len = lps[len - 1];
            else lps[i++] = 0;
        }
    }
    return lps;
}

function kmp(text, pattern) {
    let lps = lpsArray(pattern);
    let i = 0, j = 0, comparisons = 0;

    while (i < text.length) {
        comparisons++;
        if (text[i] === pattern[j]) {
            i++; j++;
        }

        if (j === pattern.length) {
            j = lps[j - 1];
        } else if (i < text.length && text[i] !== pattern[j]) {
            if (j !== 0) j = lps[j - 1];
            else i++;
        }
    }

    return comparisons;
}

// RABIN-KARP
function rabin(text, pattern) {
    let d = 256, q = 101;
    let m = pattern.length, n = text.length;
    let p = 0, t = 0, h = 1;
    let comparisons = 0;

    for (let i = 0; i < m - 1; i++)
        h = (h * d) % q;

    for (let i = 0; i < m; i++) {
        p = (d * p + pattern.charCodeAt(i)) % q;
        t = (d * t + text.charCodeAt(i)) % q;
    }

    for (let i = 0; i <= n - m; i++) {
        if (p === t) {
            for (let j = 0; j < m; j++) {
                comparisons++;
                if (text[i + j] !== pattern[j]) break;
            }
        }

        if (i < n - m) {
            t = (d * (t - text.charCodeAt(i) * h) + text.charCodeAt(i + m)) % q;
            if (t < 0) t += q;
        }
    }

    return comparisons;
}

// RUN
function run() {
    let text = document.getElementById("text").value;
    let pattern = document.getElementById("pattern").value;

    if (!text || !pattern) {
        alert("Please enter both text and pattern!");
        return;
    }

    let naiveRes = naive(text, pattern);
    let kmpRes = kmp(text, pattern);
    let rkRes = rabin(text, pattern);

    document.getElementById("results").innerHTML = `
        <div class="card">
            <h3>Naive</h3>
            <p>Comparisons: <span class="highlight">${naiveRes}</span></p>
        </div>

        <div class="card">
            <h3>KMP</h3>
            <p>Comparisons: <span class="highlight">${kmpRes}</span></p>
        </div>

        <div class="card">
            <h3>Rabin-Karp</h3>
            <p>Comparisons: <span class="highlight">${rkRes}</span></p>
        </div>
    `;
}

</script>

</body>
</html>
